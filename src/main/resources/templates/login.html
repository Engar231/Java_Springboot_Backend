<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/compito2.1_navbar.css}">
    <title>Login - Jurassic Park</title>
</head>

<body class="d-flex flex-column min-vh-100">

<header class="bordo_superiore">
    <nav class="navbar navbar-expand-md home_alto">
        <button class="navbar-brand btn p-0 border-0 me-3" type="button" data-bs-toggle="collapse" data-bs-target="#menuJurassic" aria-controls="menuJurassic" aria-expanded="false" aria-label="Toggle navigation">
            <img th:src="@{/img/r1.png}" alt="Jurassic Park" style="height: 50px; width: auto;">
        </button>

        <div class="collapse navbar-collapse" id="menuJurassic">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link text-light" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="https://i.pinimg.com/736x/8d/17/bb/8d17bb6b6e259ae43a92580d447fdd97.jpg" target="_blank">I nostri dinosauri</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="https://it.wikipedia.org/wiki/Michael_Crichton" target="_blank">Michael Crichton</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="box_sotto_form d-flex justify-content-center align-items-center flex-grow-1 my-5">
    <div class="p-4 rounded shadow-sm w-100" style="max-width: 500px; background-color: #ffffff;">

        <h3 class="mb-4 text-center">Accedi al Sistema</h3>

        <!-- Messaggio di Errore Credenziali Sbagliate -->
        <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
            Username o password non validi.
        </div>

        <!-- Messaggio di Avvenuto Logout -->
        <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
            Logout effettuato con successo.
        </div>

        <form id="formLogin" method="post" th:action="@{/login}" class="row g-3" novalidate>

            <!-- USERNAME -->
            <div class="col-md-12">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="Inserisci il tuo username" required autofocus>
            </div>

            <!-- PASSWORD -->
            <div class="col-md-12">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Inserisci la tua password" required>
            </div>

            <!-- BOTTONI AZIONE -->
            <div class="col-12 mt-4 d-flex gap-2">
                <button id="formbtn" class="btn btn-primary w-100" type="submit">Accedi</button>
            </div>

            <div class="col-12 text-center mt-3">
                <span class="small">Non hai ancora un account? </span>
                <a class="small fw-bold" th:href="@{/new}">Registrati qui</a>
            </div>

        </form>
    </div>
</main>

<footer class="barra_fondo mt-auto">
    <div class="row text-center">
        <div class="col-12 col-lg-4 text-lg-start barra_fondo_social">
            <a href="#" class="icone_social pe-2"><img th:src="@{/img/yt.png}" alt="Youtube" class="statistiche_icone"></a>
            <a href="#" class="icone_social pe-2"><img th:src="@{/img/tiktok.png}" alt="tiktok" class="statistiche_icone"></a>
            <a href="#" class="icone_social pe-2"><img th:src="@{/img/instagram.png}" alt="IG" class="statistiche_icone"></a>
            <a href="#" class="icone_social pe-2"><img th:src="@{/img/twitter.png}" alt="Twitter" class="statistiche_icone"></a>
            <a href="#" class="icone_social pe-2"><img th:src="@{/img/facebook.png}" alt="FB" class="statistiche_icone"></a>
        </div>
        <div class="col-12 col-lg-4 barra_fondo_newsletter">
            <label for="email">Iscrizione alla newsletter:</label>
            <div class="barra_fondo_newsletter-form">
                <input type="email" id="email" class="small rounded-5" placeholder="Inserisci la tua email">
                <button type="submit" class="small rounded-5">Iscriviti</button>
            </div>
        </div>
        <div class="col-12 col-lg-4 text-lg-end barra_fondo_copyright">
            <p>&copy; 03/07/2026 Jurassic Park </p>
            <p><img th:src="@{/img/phone.png}" alt="Icona Supporto" class="statistiche_icone">+39 - 000 - 00 - 00 - 000 </p>
            <p><strong>All Copyright deserve to Michael Crichton</strong></p>
        </div>
    </div>
</footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/compito2.1_navbar.js}"></script>
</body>
</html>
