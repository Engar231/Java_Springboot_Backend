<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/compito2.1_navbar.css">
  <title>Form Registrazione / Modifica Dipendente</title>
</head>

<body class="d-flex flex-column min-vh-100">
<header class="bordo_superiore">
  <nav class="navbar navbar-expand-md home_alto">
    <!-- Logo / Bottone Menu -->
    <button class="navbar-brand btn p-0 border-0 me-3" type="button" data-bs-toggle="collapse" data-bs-target="#menuJurassic" aria-controls="menuJurassic" aria-expanded="false" aria-label="Toggle navigation">
      <img th:src="@{/img/r1.png}" alt="Jurassic Park" style="height: 50px; width: auto;">
    </button>

    <!-- Menu di navigazione -->
    <div class="collapse navbar-collapse" id="menuJurassic">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link text-light" th:href="@{/home}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light" href="https://i.pinimg.com/736x/8d/17/bb/8d17bb6b6e259ae43a92580d447fdd97.jpg" target="_blank">I nostri dinosauri</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light" href="https://it.wikipedia.org/wiki/Michael_Crichton" target="_blank">Michael Crichton</a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<main class="flex-grow-1">
<div class="container-fluid px-4 mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 id="gestione">Gestione Dipendenti</h5>
    <button id="formbtn" class="btn btn-secondary btn-sm rounded-5" onclick="resetFiltri()"> Reset Filtri</button>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead>
    <!-- Intestazioni CLICCABILI -->
    <tr>
      <th scope="col" style="width: 5%;">#</th>
      <th scope="col" style="width: 10%;" class="clickable-header" onclick="toggleFiltro('filter-nome')">Nome <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 10%;" class="clickable-header" onclick="toggleFiltro('filter-cognome')">Cognome <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 12%;" class="clickable-header" onclick="toggleFiltro('filter-cf')">Codice Fiscale <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 12%;" class="clickable-header" onclick="toggleFiltro('filter-username')">Username <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 15%;" class="clickable-header" onclick="toggleFiltro('filter-email')">Email <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 12%;" class="clickable-header" onclick="toggleFiltro('filter-ruolo')">Ruolo <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 10%;" class="clickable-header" onclick="toggleFiltro('filter-stipendio')">Stipendio <i class="bi bi-chevron-down small text-muted"></i></th>
      <th scope="col" style="width: 14%;" class="clickable-header" onclick="toggleFiltro('filter-stipendio')">Azioni <i class="bi bi-chevron-down small text-muted"></i></th>
    </tr>

    <!-- Contenitori dei filtri JS -->
    <tr class="table-light">
      <td></td>
      <td><input type="text" id="filter-nome" class="form-control table-filter" placeholder="Nome..." oninput="applicaFiltriJS()"></td>
      <td><input type="text" id="filter-cognome" class="form-control table-filter" placeholder="Cognome..." oninput="applicaFiltriJS()"></td>
      <td><input type="text" id="filter-cf" class="form-control table-filter" placeholder="CF..." oninput="applicaFiltriJS()"></td>
      <td><input type="text" id="filter-username" class="form-control table-filter" placeholder="User..." oninput="applicaFiltriJS()"></td>
      <td><input type="text" id="filter-email" class="form-control table-filter" placeholder="Email..." oninput="applicaFiltriJS()"></td>
      <td>
        <select id="filter-ruolo" class="form-select table-filter" onchange="applicaFiltriJS()">
          <option value="" selected>Tutti</option>
          <option th:each="r : ${T(com.example.demo.entities.Ruolo).values()}" th:value="${r}" th:text="${r}"></option>
        </select>
      </td>
      <td><input type="number" step="0.01" id="filter-stipendio" class="form-control table-filter" placeholder="Min. €" oninput="applicaFiltriJS()"></td>
      <td></td>
    </tr>
    </thead>

    <tbody id="tabella-corpo">
    <!-- Dipendente -->
    <tr th:each="d: ${items}" class="riga-dipendente">
      <td class="col-id" th:text="${d.id}"></td>
      <td class="col-nome" th:text="${d.nome}"></td>
      <td class="col-cognome" th:text="${d.cognome}"></td>
      <td class="col-cf" th:text="${d.cf}"></td>
      <td class="col-username" th:text="${d.user != null ? d.user.username : ''}"></td>
      <td class="col-email" th:text="${d.user != null ? d.user.email : ''}"></td>
      <td class="col-ruolo" th:text="${d.tipoRuolo}"></td>
      <td class="col-stipendio" th:data-stipendio="${d.stipendio}" th:text="${'€ ' + d.stipendio}"></td>
      <td>
        <a class="btn btn-danger rounded-5 btn-sm" th:href="@{/delete(id=${d.id})}" onclick="return confirm('Sei sicuro?');">Elimina</a>
        <a class="btn btn-warning rounded-5 btn-sm" th:href="@{|/${d.id}/edit|}">Modifica</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</main>

<!--BARRA FONDO :  Parte sotto del sito con tutti i link -->
<footer class="barra_fondo">
  <div class="row text-center">

    <div class="col-12 col-lg-4 text-lg-start barra_fondo_social">
      <a href="#" class="icone_social pe-2">
        <img th:src="@{/img/yt.png}" alt="Youtube" class="statistiche_icone">
      </a>
      <a href="#" class="icone_social pe-2">
        <img th:src="@{/img/tiktok.png}" alt="tiktok" class="statistiche_icone">
      </a>
      <a href="#" class="icone_social pe-2">
        <img th:src="@{/img/instagram.png}" alt="IG" class="statistiche_icone">
      </a>
      <a href="#" class="icone_social pe-2">
        <img th:src="@{/img/twitter.png}" alt="Twitter" class="statistiche_icone">
      </a>
      <a href="#" class="icone_social pe-2">
        <img th:src="@{/img/facebook.png}" alt="FB" class="statistiche_icone">
      </a>
    </div>

    <div class="col-12 col-lg-4 barra_fondo_newsletter">
      <label for="email">Iscrizione alla newsletter:</label>
      <div class="barra_fondo_newsletter-form">
        <input type="email" id="email" class="small rounded-5" placeholder="Inserisci la tua email">
        <button type="submit" class="small rounded-5">Iscriviti</button>
      </div>
    </div>

    <div class="col-12 col-lg-4 text-lg-end barra_fondo_copyright">
      <p>&copy; 03/07/2026 Jurassic Park </p>
      <p><img th:src="@{/img/phone.png}" alt="Icona Supporto" class="statistiche_icone">+39 - 000 - 00 - 00 - 000 </p>
      <p><strong>All Copyright deserve to Michael Crichton</strong></p>
    </div>
  </div>
</footer>

<!--A fine tutto chiudiamo il body e html-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script src="js/compito2.1_navbar.js"></script>
<script th:src="@{/js/ricerca.js}"></script>
</body>
</html>
