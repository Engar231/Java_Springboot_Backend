<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Progetto - Jurassic Park</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/compito2.1_navbar.css}">
</head>

<body>
<header class="bordo_superiore">
    <nav class="navbar navbar-expand-md home_alto">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 border-0 me-3" th:href="@{/home}">
                <img th:src="@{/img/r1.png}" alt="Jurassic Park" style="height: 45px; width: auto;">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuJurassic">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuJurassic">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-light" th:href="@{/home}">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="box_sotto_form d-flex justify-content-center my-5">
    <div class="p-4 rounded shadow-sm w-100" style="max-width: 600px; background-color: #ffffff;">

        <h3 class="mb-4 text-center text-uppercase fw-bold text-dark"
            th:text="${progetto.id == null ? 'Nuovo Progetto' : 'Modifica Progetto'}">Nuovo Progetto</h3>

        <form th:action="@{/progetti/salva}" th:object="${progetto}" method="post">
            <!-- ID Nascosto per modifiche -->
            <input type="hidden" th:field="*{id}" />

            <!-- Nome Progetto -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nome Progetto</label>
                <input type="text" th:field="*{nomeP}" class="form-control" placeholder="Es. Recinzione T-Rex" required />
            </div>

            <!-- Data Inizio -->
            <div class="mb-3">
                <label class="form-label fw-bold">Data Inizio</label>
                <input type="date" th:field="*{dataStart}" class="form-control" required />
            </div>

            <!-- Data Fine -->
            <div class="mb-3">
                <label class="form-label fw-bold">Data Fine <span class="fw-normal text-muted">(opzionale)</span></label>
                <input type="date" th:field="*{dataFine}" class="form-control" />
            </div>

            <!-- Costo Progetto -->
            <div class="mb-4">
                <label class="form-label fw-bold">Costo Progetto (€)</label>
                <input type="number" step="0.01" th:field="*{costoP}" class="form-control" placeholder="Es. 1500000.00" required />
            </div>

            <!-- Bottoni -->
            <div class="d-flex justify-content-between align-items-center">
                <a th:href="@{/progetti}" class="btn btn-outline-secondary">Annulla</a>
                <button type="submit" class="btn btn-success fw-bold">Salva Progetto</button>
            </div>
        </form>
    </div>
</main>

<footer class="barra_fondo text-center py-3">
    <p class="mb-0 text-white-50">&copy; 2026 Jurassic Park | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
